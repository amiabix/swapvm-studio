[profile.default]
src = "contracts"
out = "out"
test = "test"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 700
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./node_modules/@uniswap/v4-core/out" }, { access = "read-write", path = "./artifacts" }, { access = "read", path = "./reference" }]
remappings = ["@uniswap/v4-core/=node_modules/@uniswap/v4-core/", "swap-vm/=vendor/swap-vm/", "forge-std/=node_modules/forge-std/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@1inch/solidity-utils/=node_modules/@1inch/solidity-utils/", "@1inch/aqua/=node_modules/@1inch/aqua/"]
[fuzz]
runs = 128
